name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Package Chrome extension
        run: bash extensions/chrome/package.sh

      - name: Package VS Code extension
        run: bash extensions/vscode/package.sh

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"

          # The version is compared as a literal string rather than a regex, so
          # the dots cannot act as wildcards: 0.1.6 and 0.1.64 are both real
          # releases and a pattern match would find the wrong one.
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if ($2 == ver) found = 1; next }
            found { print }
          ' CHANGELOG.md \
            | awk 'NF {body = 1} body {line[++n] = $0; if (NF) last = n} END {for (i = 1; i <= last; i++) print line[i]}' \
            > "$NOTES_FILE"

          if [ ! -s "$NOTES_FILE" ]; then
            echo "::warning::CHANGELOG.md has no section for $VERSION; publishing without notes."
            echo "Built from tag ${GITHUB_REF_NAME}." > "$NOTES_FILE"
          fi

          {
            echo ""
            echo "### Assets"
            echo "- \`varterm-cursor-${VERSION}.vsix\` — editor extension for Cursor and VS Code"
            echo "- \`varterm-tts-chrome.zip\` — Chrome extension"
          } >> "$NOTES_FILE"

          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            extensions/chrome/varterm-tts-chrome.zip
            extensions/vscode/*.vsix
