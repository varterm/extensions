<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Varterm Screenshot 4</title>
  <style>
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 30% 10%, #163028, #0b1015 58%);
      color: #e5e7eb;
      display: grid;
      grid-template-columns: 1fr 420px;
    }
    .copy { padding: 72px 56px; }
    h1 { margin: 0 0 12px; font-size: 38px; color: #f9fafb; }
    p { margin: 0 0 22px; color: #9ca3af; font-size: 18px; line-height: 1.5; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 6px 10px; border-radius: 999px; font-size: 13px; color: #d1fae5;
      background: rgba(16, 185, 129, 0.2); border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .stage {
      display: flex; align-items: center; justify-content: center;
      background: rgba(2, 6, 23, 0.55);
    }
    iframe { width: 340px; height: 740px; border: 0; border-radius: 12px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55); }
  </style>
</head>
<body>
  <div class="copy">
    <h1>Jump, change speed, keep listening</h1>
    <p>Back and ahead from the popup. Speed chips from 0.75× to 2×. Read a selection with Alt+Shift+R — Chrome uses Ctrl+Shift+R to reload.</p>
    <div class="row">
      <span class="chip">Alt+Shift+R</span>
      <span class="chip">Jump back / ahead</span>
      <span class="chip">0.75×–2×</span>
    </div>
  </div>
  <div class="stage">
    <iframe src="popup-store.html" title="Varterm popup"></iframe>
  </div>
</body>
</html>
